name: Go

on:
  push:
    branches: [ "main", "xfce" ]
    tags-ignore:
      - "v*"          # prevent infinite loops when pushing tags
  pull_request:
    branches: [ "main", "xfce" ]

jobs:
  build:
    runs-on: ubuntu-26.04

    permissions:
      contents: write   # required for tags + GitHub releases
      packages: write   # required for GHCR push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install packages
        run: |
          ls -la
          sudo apt update -y
          sudo apt install wget e2fsprogs curl qemu-utils -y

      - name: Get Rocky9
        run: |
          wget https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2

      - name: Extend cloud image with libguestfs 1.60+
        run: |
          docker_args=(
            --rm
            --volume "$GITHUB_WORKSPACE:/workspace"
            --workdir /workspace
          )

          if [[ -e /dev/kvm ]]; then
            docker_args+=(--device /dev/kvm)
          fi

          docker run "${docker_args[@]}" \
            registry.fedoraproject.org/fedora:44 \
            bash -euxo pipefail -c '
              dnf install -y --setopt=install_weak_deps=False guestfs-tools
              rpm -q libguestfs guestfs-tools
              LIBGUESTFS_BACKEND=direct \
                virt-customize \
                  -a Rocky-9-GenericCloud-Base.latest.x86_64.qcow2 \
                  --commands-from-file run-command.virt
            '
          ls -la

      - name: Compress cloud image
        run: |
          sudo qemu-img convert -c -O qcow2 Rocky-9-GenericCloud-Base.latest.x86_64.qcow2 rocky9-desktop-cloudimg-amd64.img
          ls -la

      - name: Set artifact base name
        if: github.event_name == 'push'
        id: meta
        run: |
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_base=rocky9-desktop-cloudimg-amd64-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Bump version and create tag
        if: github.event_name == 'push'
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main,xfce

      - name: Stamp release image filename
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        run: |
          mv rocky9-desktop-cloudimg-amd64.img "${{ steps.meta.outputs.artifact_base }}-${{ steps.tag.outputs.new_tag }}.img"
          ls -la

      - name: Create GitHub release
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          artifacts: ${{ steps.meta.outputs.artifact_base }}-${{ steps.tag.outputs.new_tag }}.img
